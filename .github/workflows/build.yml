name: Windows x64 Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.9.3
  BUILD_DIR: ${{ github.workspace }}\build
  INSTALL_DIR: ${{ github.workspace }}\install
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
  CMAKE_BUILD_TYPE: Release
  VCPKG_TARGET_TRIPLET: x64-windows
  VCPKG_KEEP_ENV_VARS: PATH;QT_HOST_PATH

jobs:
  build-windows-x64:
    name: Windows x64 GUI
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          tools: tools_ninja, tools_cmake
          cache: true

      - name: Locate Ninja and CMake
        shell: pwsh
        run: |
          # install-qt-action installs Qt tools, but the exact Ninja directory
          # layout is not guaranteed to be directly on PATH. Resolve it once
          # and pass the absolute executable path to CMake.
          $ninjaCommand = Get-Command ninja.exe -ErrorAction SilentlyContinue
          if ($ninjaCommand) {
            $ninjaExe = $ninjaCommand.Source
          } else {
            $ninjaFile = Get-ChildItem -Path $env:IQTA_TOOLS -Filter ninja.exe -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $ninjaFile) {
              throw "ninja.exe was not found after the Qt tools installation. IQTA_TOOLS=$env:IQTA_TOOLS"
            }
            $ninjaExe = $ninjaFile.FullName
          }

          $ninjaDir = Split-Path -Parent $ninjaExe
          $ninjaDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "NINJA_EXE=$ninjaExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $qtCMake = Join-Path $env:IQTA_TOOLS "CMake_64\bin"
          if (Test-Path $qtCMake) {
            $qtCMake | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          Write-Host "Using Ninja: $ninjaExe"
          & $ninjaExe --version
          cmake --version

      # The original repository keeps vcpkg as a git submodule. ZIP uploads
      # do not preserve that submodule object. Use a COMPLETE vcpkg clone:
      # vcpkg's version database checks out historical git tree objects, so a
      # partial/promisor clone can attempt network fetches during configure.
      - name: Bootstrap complete vcpkg checkout
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw "vcpkg.json" | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'
          if (-not $baseline) {
            throw "vcpkg.json does not contain builtin-baseline"
          }

          if (Test-Path "vcpkg") {
            Remove-Item -Recurse -Force "vcpkg"
          }

          $cloned = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Cloning complete vcpkg repository (attempt $attempt of 3)..."
            git clone https://github.com/microsoft/vcpkg.git vcpkg
            if ($LASTEXITCODE -eq 0) {
              $cloned = $true
              break
            }

            if (Test-Path "vcpkg") {
              Remove-Item -Recurse -Force "vcpkg"
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }

          if (-not $cloned) {
            throw "Unable to clone the complete vcpkg repository after 3 attempts."
          }

          # Pin the tool/ports checkout to the same baseline as the manifest.
          # The full clone keeps all historical git tree objects locally, so
          # vcpkg version resolution no longer depends on promisor fetches.
          git -C vcpkg checkout --detach $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.vcpkg/**') }}
          restore-keys: |
            vcpkg-windows-x64-

      - name: Create build directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null
          New-Item -ItemType Directory -Force -Path "${{ env.INSTALL_DIR }}" | Out-Null

      - name: Verify required GUI sources
        shell: pwsh
        run: |
          $required = @(
            "src\core\Clipboard.cpp",
            "src\core\Clipboard.h",
            "src\widgets\OpcodeList.cpp"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required GUI source is missing from the repository: $file"
            }
          }

      - name: Configure Windows x64 Release
        shell: pwsh
        run: |
          $toolchain = Join-Path "${{ github.workspace }}" "vcpkg\scripts\buildsystems\vcpkg.cmake"

          cmake -S "${{ github.workspace }}" -B "${{ env.BUILD_DIR }}" `
            -G Ninja `
            -DCMAKE_MAKE_PROGRAM="$env:NINJA_EXE" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ env.INSTALL_DIR }}" `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DGUI=ON `
            -DCLI=OFF `
            -DPRERELEASE_STRING=" GitHub build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Clipboard implementation is compiled
        shell: pwsh
        run: |
          $compileDb = Join-Path "${{ env.BUILD_DIR }}" "compile_commands.json"
          if (-not (Test-Path $compileDb)) {
            throw "CMake did not create compile_commands.json"
          }

          $commands = Get-Content -Raw $compileDb
          if ($commands -notmatch 'Clipboard[.]cpp') {
            throw "Clipboard.cpp is missing from the generated GUI compile rules"
          }

          Write-Host "Verified: Clipboard.cpp is part of the Windows x64 GUI target."

      - name: Build and package
        shell: pwsh
        run: |
          cmake --build "${{ env.BUILD_DIR }}" --target package --parallel 3 --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Windows x64 package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path "${{ env.BUILD_DIR }}" -Filter "*.zip" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $package) {
            throw "CMake/CPack did not create a ZIP package in ${{ env.BUILD_DIR }}"
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item $package.FullName "dist\Makou_Reactor-Windows-x64.zip"
          Write-Host "Package: $($package.FullName)"

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v7
        with:
          path: dist/Makou_Reactor-Windows-x64.zip
          archive: false
          if-no-files-found: error

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-build-logs
          path: vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
